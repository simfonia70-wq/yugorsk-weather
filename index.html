<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Погода • Семейное табло</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      min-height: 100vh;
      color: #fff;
      padding: 14px;
      background: #0f172a center/cover no-repeat fixed;
      transition: background-image 0.5s ease;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      z-index: 0;
    }

    .layout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .side-title {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 2px 4px;
    }

    .city-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      transition: all 0.2s ease;
    }

    .city-btn.active {
      border-color: #38bdf8;
      background: rgba(2, 132, 199, 0.35);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .city-name { font-size: 16px; font-weight: 700; }
    .city-sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .side-temp { font-size: 19px; font-weight: 800; color: #38bdf8; }

    .main-board {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 6px;
    }

    .board-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .board-city { font-size: 26px; font-weight: 800; }
    .board-region { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .board-time {
      font-size: 12px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 4px 10px;
      border-radius: 10px;
      font-weight: 600;
    }

    .board-center {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin: 6px 0;
    }

    .big-degrees { font-size: 52px; font-weight: 900; line-height: 1; }
    .weather-condition { font-size: 17px; color: #cbd5e1; font-weight: 500; }

    .board-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 12px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="layout">
    <div class="side-title">Города</div>

    <!-- Список городов -->
    <div class="city-btn active" onclick="pickCity('yugorsk', this)">
      <div>
        <div class="city-name">Югорск</div>
        <div class="city-sub">ХМАО — Югра</div>
      </div>
      <div class="side-temp" id="side-yugorsk">...</div>
    </div>

    <div class="city-btn" onclick="pickCity('ekb', this)">
      <div>
        <div class="city-name">Екатеринбург</div>
        <div class="city-sub">Урал</div>
      </div>
      <div class="side-temp" id="side-ekb">...</div>
    </div>

    <div class="city-btn" onclick="pickCity('nnov', this)">
      <div>
        <div class="city-name">Н. Новгород</div>
        <div class="city-sub">Бор</div>
      </div>
      <div class="side-temp" id="side-nnov">...</div>
    </div>

    <div class="city-btn" onclick="pickCity('msk', this)">
      <div>
        <div class="city-name">Москва</div>
        <div class="city-sub">Центр</div>
      </div>
      <div class="side-temp" id="side-msk">...</div>
    </div>

    <!-- Главная плашка -->
    <div class="main-board">
      <div class="board-top">
        <div>
          <div class="board-city" id="mainCityName">Югорск</div>
          <div class="board-region" id="mainCityRegion">ХМАО — Югра</div>
        </div>
        <div class="board-time" id="dayNightBadge">День ☀️</div>
      </div>

      <div class="board-center">
        <div class="big-degrees" id="mainDegree">...</div>
        <div class="weather-condition" id="mainCondition">Обновление...</div>
      </div>

      <div class="board-bottom">
        <span>Данные в реальном времени</span>
        <span id="updateTime">Онлайн</span>
      </div>
    </div>
  </div>

  <script>
    const cities = {
      yugorsk: { name: "Югорск", region: "ХМАО — Югра", lat: 61.3123, lon: 63.3317, bgDay: "https://images.unsplash.com/photo-1517824806704-9040b037703b?w=1200", bgNight: "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200" },
      ekb: { name: "Екатеринбург", region: "Урал", lat: 56.8389, lon: 60.6057, bgDay: "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=1200", bgNight: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=1200" },
      nnov: { name: "Н. Новгород", region: "Бор", lat: 56.3269, lon: 44.0059, bgDay: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200", bgNight: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1200" },
      msk: { name: "Москва", region: "Центр", lat: 55.7558, lon: 37.6173, bgDay: "https://images.unsplash.com/photo-1513326738677-b964603b136d?w=1200", bgNight: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=1200" }
    };

    let activeKey = 'yugorsk';
    let dataCache = {};

    function isNight() {
      const h = new Date().getHours();
      return (h >= 21 || h < 6);
    }

    function weatherCodeToText(code) {
      if (code === 0) return "Ясно ☀️";
      if (code <= 2) return "Переменная облачность ⛅";
      if (code === 3) return "Пасмурно ☁️";
      if (code >= 45 && code <= 48) return "Туман 🌫️";
      if (code >= 51 && code <= 67) return "Небольшой дождь 🌧️";
      if (code >= 71 && code <= 77) return "Снегопад ❄️";
      if (code >= 80 && code <= 82) return "Ливень 🌧️";
      return "Облачно ☁️";
    }

    function updateMainDisplay(cityKey) {
      const c = cities[cityKey];
      const night = isNight();
      document.body.style.backgroundImage = 'url("' + (night ? c.bgNight : c.bgDay) + '")';
      document.getElementById('mainCityName').innerText = c.name;
      document.getElementById('mainCityRegion').innerText = c.region;
      document.getElementById('dayNightBadge').innerText = night ? 'Режим: Ночь 🌙' : 'Режим: День ☀️';

      if (dataCache[cityKey]) {
        document.getElementById('mainDegree').innerText = dataCache[cityKey].temp;
        document.getElementById('mainCondition').innerText = dataCache[cityKey].cond;
      }
    }

    function pickCity(cityKey, el) {
      activeKey = cityKey;
      document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      updateMainDisplay(cityKey);
    }

    function applyCityWeather(cityKey, tempNum, code) {
      const sign = tempNum > 0 ? '+' : '';
      const tempStr = sign + tempNum + '°';
      const condStr = weatherCodeToText(code);

      dataCache[cityKey] = { temp: tempStr, cond: condStr };

      const sideEl = document.getElementById('side-' + cityKey);
      if (sideEl) sideEl.innerText = tempStr;

      if (cityKey === activeKey) {
        document.getElementById('mainDegree').innerText = tempStr;
        document.getElementById('mainCondition').innerText = condStr;
      }
    }

    function loadCity(cityKey) {
      const c = cities[cityKey];
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code&timezone=auto`;

      fetch(url)
        .then(res => res.json())
        .then(d => {
          if (d && d.current) {
            applyCityWeather(cityKey, Math.round(d.current.temperature_2m), d.current.weather_code);
          }
        })
        .catch(() => {
          // Запасной шлюз если мобильный оператор сбоит
          fetch('https://wttr.in/' + encodeURIComponent(c.name) + '?format=j1')
            .then(r => r.json())
            .then(wData => {
              const cur = wData.current_condition[0];
              applyCityWeather(cityKey, parseInt(cur.temp_C, 10), 1);
            })
            .catch(() => {});
        });
    }

    function init() {
      updateMainDisplay('yugorsk');
      for (const k in cities) {
        loadCity(k);
      }
    }

    init();
  </script>
</body>
</html>
