<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Погода • Семейное табло</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      min-height: 100vh;
      color: #fff;
      padding: 16px;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transition: background-image 0.5s ease-in-out;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 17, 33, 0.82);
      z-index: 0;
    }

    .layout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: row;
      gap: 16px;
      margin-top: 10px;
    }

    .sidebar {
      flex: 0 0 250px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .side-title {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 0 4px;
    }

    .city-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      color: #fff;
    }

    .city-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .city-btn.active {
      border-color: #38bdf8;
      background: rgba(2, 132, 199, 0.35);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .city-name { font-size: 16px; font-weight: 700; }
    .city-sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .side-temp { font-size: 20px; font-weight: 800; color: #38bdf8; }

    .main-board {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 280px;
    }

    .board-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .board-city { font-size: 28px; font-weight: 800; }
    .board-region { font-size: 14px; color: #94a3b8; margin-top: 4px; }
    .board-time {
      font-size: 13px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    .board-center {
      margin: 24px 0;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .big-degrees {
      font-size: 60px;
      font-weight: 900;
      line-height: 1;
    }

    .weather-condition {
      font-size: 20px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .board-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 14px;
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .sidebar { flex: none; width: 100%; }
      .main-board { padding: 20px; min-height: auto; }
      .big-degrees { font-size: 48px; }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="layout">
    <div class="sidebar">
      <div class="side-title">Города</div>

      <div class="city-btn active" onclick="pickCity('yugorsk', this)">
        <div>
          <div class="city-name">Югорск</div>
          <div class="city-sub">ХМАО — Югра</div>
        </div>
        <div class="side-temp" id="side-yugorsk">...</div>
      </div>

      <div class="city-btn" onclick="pickCity('ekb', this)">
        <div>
          <div class="city-name">Екатеринбург</div>
          <div class="city-sub">Урал</div>
        </div>
        <div class="side-temp" id="side-ekb">...</div>
      </div>

      <div class="city-btn" onclick="pickCity('nnov', this)">
        <div>
          <div class="city-name">Н. Новгород</div>
          <div class="city-sub">Волга • Бор</div>
        </div>
        <div class="side-temp" id="side-nnov">...</div>
      </div>

      <div class="city-btn" onclick="pickCity('msk', this)">
        <div>
          <div class="city-name">Москва</div>
          <div class="city-sub">Центр</div>
        </div>
        <div class="side-temp" id="side-msk">...</div>
      </div>
    </div>

    <div class="main-board">
      <div class="board-top">
        <div>
          <div class="board-city" id="mainCityName">Югорск</div>
          <div class="board-region" id="mainCityRegion">ХМАО — Югра</div>
        </div>
        <div class="board-time" id="dayNightBadge">Режим: День ☀️</div>
      </div>

      <div class="board-center">
        <div class="big-degrees" id="mainDegree">...</div>
        <div class="weather-condition" id="mainCondition">Получение температуры...</div>
      </div>

      <div class="board-bottom">
        <span>Обновление онлайн</span>
        <span id="updateTime">Реальное время</span>
      </div>
    </div>
  </div>

  <script>
    const cities = {
      yugorsk: {
        name: "Югорск",
        region: "ХМАО — Югра",
        lat: 61.3123, lon: 63.3317,
        dayBg: "https://images.unsplash.com/photo-1517824806704-9040b037703b?q=80&w=1600&auto=format&fit=crop",
        nightBg: "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1600&auto=format&fit=crop"
      },
      ekb: {
        name: "Екатеринбург",
        region: "Свердловская область",
        lat: 56.8389, lon: 60.6057,
        dayBg: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1600&auto=format&fit=crop",
        nightBg: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1600&auto=format&fit=crop"
      },
      nnov: {
        name: "Нижний Новгород / Бор",
        region: "Нижегородская область",
        lat: 56.3269, lon: 44.0059,
        dayBg: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600&auto=format&fit=crop",
        nightBg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600&auto=format&fit=crop"
      },
      msk: {
        name: "Москва",
        region: "Центр",
        lat: 55.7558, lon: 37.6173,
        dayBg: "https://images.unsplash.com/photo-1513326738677-b964603b136d?q=80&w=1600&auto=format&fit=crop",
        nightBg: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=1600&auto=format&fit=crop"
      }
    };

    let activeKey = 'yugorsk';
    let dataCache = {};

    function isNight() {
      const h = new Date().getHours();
      return (h >= 21 || h < 6);
    }

    function weatherCodeToText(code) {
      if (code === 0) return "Ясно ☀️";
      if (code <= 2) return "Переменная облачность ⛅";
      if (code === 3) return "Пасмурно ☁️";
      if (code >= 45 && code <= 48) return "Туман 🌫️";
      if (code >= 51 && code <= 67) return "Дождь 🌧️";
      if (code >= 71 && code <= 77) return "Снегопад ❄️";
      if (code >= 80 && code <= 82) return "Ливень 🌧️";
      if (code >= 85 && code <= 86) return "Метель 🌨️";
      if (code >= 95) return "Гроза ⚡";
      return "Облачно ☁️";
    }

    function updateMainDisplay(cityKey) {
      const city = cities[cityKey];
      const night = isNight();
      
      document.body.style.backgroundImage = `url('${night ? city.nightBg : city.dayBg}')`;
      document.getElementById('mainCityName').innerText = city.name;
      document.getElementById('mainCityRegion').innerText = city.region;
      document.getElementById('dayNightBadge').innerText = night ? 'Режим: Ночь 🌙' : 'Режим: День ☀️';

      if (dataCache[cityKey]) {
        document.getElementById('mainDegree').innerText = dataCache[cityKey].temp;
        document.getElementById('mainCondition').innerText = dataCache[cityKey].cond;
      }
    }

    function pickCity(cityKey, el) {
      activeKey = cityKey;
      document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      updateMainDisplay(cityKey);
    }

    function fetchCity(cityKey) {
      const c = cities[cityKey];
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + c.lat + '&longitude=' + c.lon + '&current=temperature_2m,weather_code';

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          const t = Math.round(data.current.temperature_2m);
          const sign = t > 0 ? '+' : '';
          const tempText = sign + t + '°';
          const condText = weatherCodeToText(data.current.weather_code);

          dataCache[cityKey] = { temp: tempText, cond: condText };

          const sideEl = document.getElementById('side-' + cityKey);
          if (sideEl) sideEl.innerText = tempText;

          if (cityKey === activeKey) {
            document.getElementById('mainDegree').innerText = tempText;
            document.getElementById('mainCondition').innerText = condText;
          }
        })
        .catch(function(err) {
          // Если первый сервер не ответил, пробуем через запасной прокси wttr.in
          fetch('https://wttr.in/' + encodeURIComponent(c.name) + '?format=j1')
            .then(function(r) { return r.json(); })
            .then(function(wData) {
              const cur = wData.current_condition[0];
              const t = parseInt(cur.temp_C, 10);
              const sign = t > 0 ? '+' : '';
              const tempText = sign + t + '°';
              const condText = cur.lang_ru && cur.lang_ru[0] ? cur.lang_ru[0].value : cur.weatherDesc[0].value;

              dataCache[cityKey] = { temp: tempText, cond: condText };
              const sideEl = document.getElementById('side-' + cityKey);
              if (sideEl) sideEl.innerText = tempText;
              if (cityKey === activeKey) {
                document.getElementById('mainDegree').innerText = tempText;
                document.getElementById('mainCondition').innerText = condText;
              }
            })
            .catch(function() {
              const sideEl = document.getElementById('side-' + cityKey);
              if (sideEl && sideEl.innerText === '...') sideEl.innerText = 'н/д';
            });
        });
    }

    function init() {
      updateMainDisplay('yugorsk');
      for (const k in cities) {
        fetchCity(k);
      }
    }

    init();
  </script>
</body>
</html>
