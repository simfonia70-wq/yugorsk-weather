<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Погода • Семейное табло</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      min-height: 100vh;
      color: #fff;
      padding: 16px;
      background: #0b1120 center/cover no-repeat fixed;
      transition: background-image 0.5s ease;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 20%, rgba(15, 23, 42, 0.75), rgba(7, 11, 22, 0.92));
      z-index: 0;
    }

    .layout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: row;
      gap: 16px;
      margin-top: 10px;
    }

    .sidebar {
      flex: 0 0 260px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .city-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }

    .city-btn.active {
      border-color: #38bdf8;
      background: rgba(14, 165, 233, 0.18);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }

    .city-name { font-size: 16px; font-weight: 700; }
    .city-sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    
    .city-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .side-icon { font-size: 20px; }
    .side-temp { font-size: 19px; font-weight: 800; color: #38bdf8; }

    /* Главный дисплей с подсветкой и градиентом */
    .main-board {
      flex: 1;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.03) 100%);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 26px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 270px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    /* Фоновое мягкое свечение внутри главного экрана */
    .main-board::before {
      content: "";
      position: absolute;
      top: -50px;
      right: -50px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .board-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .board-city { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .board-region { font-size: 14px; color: #94a3b8; margin-top: 4px; }
    
    .board-badge {
      font-size: 13px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 5px 12px;
      border-radius: 12px;
      font-weight: 600;
    }

    .board-center {
      margin: 24px 0;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .main-icon { font-size: 48px; line-height: 1; }
    .big-degrees { font-size: 58px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
    .weather-condition { font-size: 19px; color: #e2e8f0; font-weight: 500; }

    .board-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Мобильный вид: главный экран сверху, кнопки снизу */
    @media (max-width: 768px) {
      .layout { 
        flex-direction: column; 
      }
      .main-board { 
        order: 1; 
        padding: 22px; 
        min-height: auto; 
      }
      .sidebar { 
        order: 2; 
        flex: none; 
        width: 100%; 
      }
      .big-degrees { font-size: 52px; }
      .main-icon { font-size: 42px; }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="layout">
    <!-- Список кнопок городов -->
    <div class="sidebar">
      <div class="city-btn active" onclick="pickCity('yugorsk', this)">
        <div>
          <div class="city-name">Югорск</div>
          <div class="city-sub">ХМАО — Югра</div>
        </div>
        <div class="city-right">
          <span class="side-icon" id="icon-yugorsk">☁️</span>
          <span class="side-temp" id="side-yugorsk">...</span>
        </div>
      </div>

      <div class="city-btn" onclick="pickCity('ekb', this)">
        <div>
          <div class="city-name">Екатеринбург</div>
          <div class="city-sub">Урал</div>
        </div>
        <div class="city-right">
          <span class="side-icon" id="icon-ekb">☁️</span>
          <span class="side-temp" id="side-ekb">...</span>
        </div>
      </div>

      <div class="city-btn" onclick="pickCity('nnov', this)">
        <div>
          <div class="city-name">Н. Новгород</div>
          <div class="city-sub">Бор</div>
        </div>
        <div class="city-right">
          <span class="side-icon" id="icon-nnov">☁️</span>
          <span class="side-temp" id="side-nnov">...</span>
        </div>
      </div>

      <div class="city-btn" onclick="pickCity('msk', this)">
        <div>
          <div class="city-name">Москва</div>
          <div class="city-sub">Центр</div>
        </div>
        <div class="city-right">
          <span class="side-icon" id="icon-msk">☁️</span>
          <span class="side-temp" id="side-msk">...</span>
        </div>
      </div>
    </div>

    <!-- Главный экран -->
    <div class="main-board">
      <div class="board-top">
        <div>
          <div class="board-city" id="mainCityName">Югорск</div>
          <div class="board-region" id="mainCityRegion">ХМАО — Югра</div>
        </div>
        <div class="board-badge" id="timeOfDayBadge">Ночь 🌙</div>
      </div>

      <div class="board-center">
        <span class="main-icon" id="mainIcon">☁️</span>
        <div>
          <div class="big-degrees" id="mainDegree">...</div>
          <div class="weather-condition" id="mainCondition">Загрузка...</div>
        </div>
      </div>

      <div class="board-bottom">
        <span>Метеоданные онлайн</span>
        <span id="updateTime">Загрузка...</span>
      </div>
    </div>
  </div>

  <script>
    var cities = {
      yugorsk: { name: "Югорск", region: "ХМАО — Югра", bgDay: "https://images.unsplash.com/photo-1517824806704-9040b037703b?w=1200", bgNight: "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200" },
      ekb: { name: "Екатеринбург", region: "Свердловская область", bgDay: "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=1200", bgNight: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=1200" },
      nnov: { name: "Нижний Новгород / Бор", region: "Нижегородская область", bgDay: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200", bgNight: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1200" },
      msk: { name: "Москва", region: "Центр", bgDay: "https://images.unsplash.com/photo-1513326738677-b964603b136d?w=1200", bgNight: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=1200" }
    };

    var activeKey = 'yugorsk';
    var dataCache = {};

    function isNight() {
      var h = new Date().getHours();
      return (h >= 21 || h < 6);
    }

    function parseWeather(code) {
      var night = isNight();
      if (code === 0) return { text: "Ясно", icon: night ? "🌙" : "☀️" };
      if (code <= 2) return { text: "Переменная облачность", icon: night ? "☁️" : "⛅" };
      if (code === 3) return { text: "Пасмурно", icon: "☁️" };
      if (code >= 45 && code <= 48) return { text: "Туман", icon: "🌫️" };
      if (code >= 51 && code <= 67) return { text: "Дождь", icon: "🌧️" };
      if (code >= 71 && code <= 77) return { text: "Снег", icon: "❄️" };
      if (code >= 80 && code <= 82) return { text: "Ливень", icon: "🌧️" };
      return { text: "Облачно", icon: "☁️" };
    }

    function updateMainDisplay(cityKey) {
      var c = cities[cityKey];
      var night = isNight();
      document.body.style.backgroundImage = 'url("' + (night ? c.bgNight : c.bgDay) + '")';
      document.getElementById('mainCityName').innerText = c.name;
      document.getElementById('mainCityRegion').innerText = c.region;
      document.getElementById('timeOfDayBadge').innerText = night ? 'Ночь 🌙' : 'День ☀️';

      if (dataCache[cityKey]) {
        document.getElementById('mainDegree').innerText = dataCache[cityKey].temp;
        document.getElementById('mainCondition').innerText = dataCache[cityKey].text;
        document.getElementById('mainIcon').innerText = dataCache[cityKey].icon;
      }
    }

    function pickCity(cityKey, el) {
      activeKey = cityKey;
      var btns = document.querySelectorAll('.city-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
      el.classList.add('active');
      updateMainDisplay(cityKey);
    }

    function applyCityWeather(cityKey, tempNum, weatherCode) {
      var sign = tempNum > 0 ? '+' : '';
      var tempText = sign + tempNum + '°';
      var wInfo = parseWeather(weatherCode);

      dataCache[cityKey] = { temp: tempText, text: wInfo.text, icon: wInfo.icon };

      var sideTemp = document.getElementById('side-' + cityKey);
      var sideIcon = document.getElementById('icon-' + cityKey);
      if (sideTemp) sideTemp.innerText = tempText;
      if (sideIcon) sideIcon.innerText = wInfo.icon;

      if (cityKey === activeKey) {
        document.getElementById('mainDegree').innerText = tempText;
        document.getElementById('mainCondition').innerText = wInfo.text;
        document.getElementById('mainIcon').innerText = wInfo.icon;
      }
    }

    function loadLocalWeather() {
      fetch('weather.json?t=' + Date.now())
        .then(function(res) { return res.json(); })
        .then(function(json) {
          if (json && json.cities) {
            for (var k in json.cities) {
              if (cities[k]) {
                applyCityWeather(k, json.cities[k].temp, json.cities[k].code);
              }
            }
            var now = new Date();
            var timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            var updateEl = document.getElementById('updateTime');
            if (updateEl) {
              updateEl.innerText = 'Обновлено в ' + timeStr;
            }
          }
        })
        .catch(function(err) {
          console.error("Ошибка загрузки данных", err);
        });
    }

    function init() {
      updateMainDisplay('yugorsk');
      loadLocalWeather();
      setInterval(loadLocalWeather, 10 * 60 * 1000);
    }

    init();
  </script>
</body>
</html>
