<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Погода • Семейное табло</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      min-height: 100vh;
      color: #fff;
      padding: 16px;
      background: #0f172a center/cover no-repeat fixed;
      transition: background-image 0.5s ease;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      z-index: 0;
    }

    .layout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: row;
      gap: 16px;
      margin-top: 10px;
    }

    .sidebar {
      flex: 0 0 240px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .city-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      transition: all 0.2s ease;
    }

    .city-btn.active {
      border-color: #38bdf8;
      background: rgba(2, 132, 199, 0.35);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .city-name { font-size: 16px; font-weight: 700; }
    .city-sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .side-temp { font-size: 18px; font-weight: 800; color: #38bdf8; }

    .main-board {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 260px;
    }

    .board-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .board-city { font-size: 26px; font-weight: 800; }
    .board-region { font-size: 14px; color: #94a3b8; margin-top: 4px; }
    .board-time {
      font-size: 13px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 4px 10px;
      border-radius: 10px;
      font-weight: 600;
    }

    .board-center {
      margin: 20px 0;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .big-degrees { font-size: 56px; font-weight: 900; }
    .weather-condition { font-size: 18px; color: #cbd5e1; }

    .board-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 12px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .sidebar { flex: none; width: 100%; }
      .main-board { padding: 18px; min-height: auto; }
      .big-degrees { font-size: 46px; }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="layout">
    <div class="sidebar">
      <div class="city-btn active" onclick="pickCity('yugorsk', this)">
        <div>
          <div class="city-name">Югорск</div>
          <div class="city-sub">ХМАО — Югра</div>
        </div>
        <div class="side-temp" id="side-yugorsk">...</div>
      </div>

      <div class="city-btn" onclick="pickCity('ekb', this)">
        <div>
          <div class="city-name">Екатеринбург</div>
          <div class="city-sub">Урал</div>
        </div>
        <div class="side-temp" id="side-ekb">...</div>
      </div>

      <div class="city-btn" onclick="pickCity('nnov', this)">
        <div>
          <div class="city-name">Н. Новгород</div>
          <div class="city-sub">Бор</div>
        </div>
        <div class="side-temp" id="side-nnov">...</div>
      </div>

      <div class="city-btn" onclick="pickCity('msk', this)">
        <div>
          <div class="city-name">Москва</div>
          <div class="city-sub">Центр</div>
        </div>
        <div class="side-temp" id="side-msk">...</div>
      </div>
    </div>

    <div class="main-board">
      <div class="board-top">
        <div>
          <div class="board-city" id="mainCityName">Югорск</div>
          <div class="board-region" id="mainCityRegion">ХМАО — Югра</div>
        </div>
        <div class="board-time" id="dayNightBadge">День ☀️</div>
      </div>

      <div class="board-center">
        <div class="big-degrees" id="mainDegree">...</div>
        <div class="weather-condition" id="mainCondition">Загрузка...</div>
      </div>

      <div class="board-bottom">
        <span>Обновление онлайн</span>
        <span id="updateTime">Реальное время</span>
      </div>
    </div>
  </div>

  <script>
    var cities = {
      yugorsk: { name: "Югорск", region: "ХМАО — Югра", bgDay: "https://images.unsplash.com/photo-1517824806704-9040b037703b?w=1200", bgNight: "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200" },
      ekb: { name: "Екатеринбург", region: "Свердловская область", bgDay: "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=1200", bgNight: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=1200" },
      nnov: { name: "Нижний Новгород / Бор", region: "Нижегородская область", bgDay: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200", bgNight: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1200" },
      msk: { name: "Москва", region: "Центр", bgDay: "https://images.unsplash.com/photo-1513326738677-b964603b136d?w=1200", bgNight: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=1200" }
    };

    var activeKey = 'yugorsk';
    var dataCache = {};

    function isNight() {
      var h = new Date().getHours();
      return (h >= 21 || h < 6);
    }

    function weatherCodeToText(code) {
      if (code === 0) return "Ясно ☀️";
      if (code <= 2) return "Переменная облачность ⛅";
      if (code === 3) return "Пасмурно ☁️";
      if (code >= 45 && code <= 48) return "Туман 🌫️";
      if (code >= 51 && code <= 67) return "Дождь 🌧️";
      if (code >= 71 && code <= 77) return "Снег ❄️";
      if (code >= 80 && code <= 82) return "Ливень 🌧️";
      return "Облачно ☁️";
    }

    function updateMainDisplay(cityKey) {
      var c = cities[cityKey];
      var night = isNight();
      document.body.style.backgroundImage = 'url("' + (night ? c.bgNight : c.bgDay) + '")';
      document.getElementById('mainCityName').innerText = c.name;
      document.getElementById('mainCityRegion').innerText = c.region;
      document.getElementById('dayNightBadge').innerText = night ? 'Режим: Ночь 🌙' : 'Режим: День ☀️';

      if (dataCache[cityKey]) {
        document.getElementById('mainDegree').innerText = dataCache[cityKey].temp;
        document.getElementById('mainCondition').innerText = dataCache[cityKey].cond;
      }
    }

    function pickCity(cityKey, el) {
      activeKey = cityKey;
      var btns = document.querySelectorAll('.city-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
      el.classList.add('active');
      updateMainDisplay(cityKey);
    }

    function applyCityWeather(cityKey, tempNum, weatherCode) {
      var sign = tempNum > 0 ? '+' : '';
      var tempText = sign + tempNum + '°';
      var condText = weatherCodeToText(weatherCode);

      dataCache[cityKey] = { temp: tempText, cond: condText };

      var sideEl = document.getElementById('side-' + cityKey);
      if (sideEl) sideEl.innerText = tempText;

      if (cityKey === activeKey) {
        document.getElementById('mainDegree').innerText = tempText;
        document.getElementById('mainCondition').innerText = condText;
      }
    }

    // Единственный локальный запрос к нашему собственному файлу
    function loadLocalWeather() {
      fetch('weather.json?t=' + Date.now())
        .then(function(res) { return res.json(); })
        .then(function(json) {
          if (json && json.cities) {
            for (var k in json.cities) {
              if (cities[k]) {
                applyCityWeather(k, json.cities[k].temp, json.cities[k].code);
              }
            }
          }
        })
        .catch(function(err) {
          console.error("Не удалось прочитать weather.json", err);
        });
    }

    function init() {
      updateMainDisplay('yugorsk');
      loadLocalWeather();
    }

    init();
  </script>
</body>
</html>
