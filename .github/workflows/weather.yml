name: Update Weather Data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Weather Data
        run: |
          python3 -c "
          import urllib.request
          import json
          import datetime

          cities = {
              'yugorsk': {'lat': 61.3123, 'lon': 63.3317},
              'ekb': {'lat': 56.8389, 'lon': 60.6057},
              'nnov': {'lat': 56.3269, 'lon': 44.0059},
              'msk': {'lat': 55.7558, 'lon': 37.6173}
          }

          result = {
              'updated': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'cities': {}
          }

          for key, c in cities.items():
              url = (
                  f\"https://api.open-meteo.com/v1/forecast\"
                  f\"?latitude={c['lat']}\"
                  f\"&longitude={c['lon']}\"
                  f\"&current=temperature_2m,weather_code\"
              )

              req = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'GitHub-Action-Weather'}
              )

              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read().decode())

              result['cities'][key] = {
                  'temp': round(data['current']['temperature_2m']),
                  'code': data['current']['weather_code']
              }

          with open('weather.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          "

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add weather.json

          if git diff --cached --quiet; then
            echo "Weather data has not changed."
          else
            git commit -m "Update weather"
            git push
          fi
